name: CI

# ⚠️ THIS REPO HAD NO CI UNTIL 0.3.0 SHIPPED, AND THAT IS HOW THE GATE ROTTED.
#
# Four lanes — `bun test`, `typecheck`, `build` (which runs a SECOND typecheck
# plus the live-example checker) and the Playwright scene lane — were all
# hand-run. The measured cost: the doc-test corpus went from passing to
# silently skipped across an upstream upgrade and nobody noticed, which is
# exactly the failure mode tosijs-ui's own ci.yml records from the other side
# ("the Playwright lane sat red across 23 tags in ~4 weeks").
#
# A lane that is not in CI will rot. Name every lane and run every lane.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Everything that does not need a browser.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PINNED, and it has to be. `docs/` is the published site and is
      # COMMITTED, and the tree-clean gate below asserts a rebuild reproduces
      # it — so CI must bundle with the same toolchain a developer did. It
      # did not: CI pulled bun 1.4.2 against a `docs/` built with 1.4.0, the
      # chunk contents differed, and the gate went red on output nobody had
      # changed.
      #
      # ⚠️ A bun upgrade therefore means rebuilding `docs/` and committing it
      # in the same change. That is the point rather than a nuisance: the
      # published site should be built by the toolchain the project claims to
      # use, and a red gate is how you find out it is not.
      #
      # It then happened the OTHER way: this said `1.4.0` inline while the
      # developer's machine had moved to 1.4.2, and three pushes went red
      # before anyone read the result. So the version lives in `.bun-version`
      # — read here, by `publish.yml`, and by `src/bun-version.test.ts`, which
      # fails the local `bun test` on a mismatch, where it is cheap.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      - name: Unit suite (happy-dom)
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      # NOT redundant with the step above. `bun run build` runs the BUILD
      # typecheck (`tsconfig.build.json`, which emits declarations) and the
      # live-example checker, and each has caught things the root typecheck
      # cannot see: `withAttributes()` fails declaration emit with TS2742 while
      # `bun run typecheck` passes either way, and the example checker is what
      # finally reported that the README's headline example had never run and
      # was naming a function this package has never exported.
      - name: Build (second typecheck + live-example checker)
        run: bun run build

      # AFTER the build, deliberately: the doc system rewrites source markdown
      # as a side effect of building (tosijs-ui#165), so a check run before it
      # measures a tree no developer ever has.
      - name: Formatting
        run: bun run format:check

      # A build that dirties a tracked file is a generated file nobody is
      # gating. Cheaper and more durable than maintaining a list of which files
      # are generated — a list cannot omit the next one, and it always does.
      - name: The build leaves the tree clean
        run: |
          # ONE NAMED EXCEPTION, and it is not drift. `docs/version.json`
          # records the COMMIT AND TIME that built the site, so it cannot
          # match a rebuild at a later commit by construction — CI always
          # builds at least one commit past the one that produced the
          # committed file. Excluded by name rather than by ignoring `docs/`,
          # which is where the drift this gate exists for would actually
          # live.
          DIRTY="$(git status --porcelain -- . ':!docs/version.json')"
          if [ -n "$DIRTY" ]; then
            echo "::error::the build modified tracked files — either a generated file was not committed, or the toolchain drifted from the pinned bun version above (in which case rebuild docs/ and commit it):"
            echo "$DIRTY"
            # Names only. The bundles are megabytes of minified output and a
            # full diff buries the one line that says WHICH file moved.
            git diff --stat -- . ':!docs/version.json'
            exit 1
          fi

  # ── the peer CEILING ────────────────────────────────────────────────────
  #
  # We develop against the FLOOR of the range we advertise, which is right and
  # is enforced by `peer-range.test.ts`. But `scene-schemas.test.ts` compares
  # our panel's property list against the INSTALLED tosijs-3d — so it has only
  # ever checked the floor, while the range says `^0.8.1` and a consumer may
  # be on anything above it.
  #
  # That is the exact silent drift the mechanism exists to prevent, one
  # version away: upstream adds a property or changes a range, our panel keeps
  # showing the old one, and nothing says so until somebody looks at a slider
  # that lies. Here we install the LATEST and run the two drift guards against
  # it.
  #
  # A separate job so a red ceiling never hides a red unit lane, and blocking
  # rather than advisory: if it fails, either the drift is real and we adopt
  # it, or the exception list needs a new entry with a reason. Both are work,
  # and neither should wait for a consumer to report it.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      - name: Install the newest tosijs-3d our range admits
        run: |
          bun add tosijs-3d@latest
          FLOOR=$(node -p "require('./package.json').peerDependencies['tosijs-3d'].replace(/^\^/, '')")
          NOW=$(node -p "require('./node_modules/tosijs-3d/package.json').version")
          echo "floor $FLOOR · testing against $NOW"
          if [ "$FLOOR" = "$NOW" ]; then
            echo "::notice::latest IS the floor today, so this run re-checks the floor rather than the ceiling"
          fi

      # ONLY the drift guards. The rest of the suite would fail on purpose:
      # `peer-range.test.ts` asserts the devDependency is pinned to the floor,
      # and we have just deliberately unpinned it.
      - name: Schema drift guards
        run: bun test src/runtime/scene-schemas.test.ts src/runtime/migrate-vocabulary.test.ts

  # The scene lane: real Chromium, real WebGL2 (SwiftShader), asserting the
  # RENDERER rather than the element. Everything in `unit` runs under happy-dom,
  # which has no WebGL, no layout and no render loop — so what the features
  # actually DO is invisible to it. Six defects reached 0.3.0's changelog that
  # only a real scene could have caught.
  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PINNED, and it has to be. `docs/` is the published site and is
      # COMMITTED, and the tree-clean gate below asserts a rebuild reproduces
      # it — so CI must bundle with the same toolchain a developer did. It
      # did not: CI pulled bun 1.4.2 against a `docs/` built with 1.4.0, the
      # chunk contents differed, and the gate went red on output nobody had
      # changed.
      #
      # ⚠️ A bun upgrade therefore means rebuilding `docs/` and committing it
      # in the same change. That is the point rather than a nuisance: the
      # published site should be built by the toolchain the project claims to
      # use, and a red gate is how you find out it is not.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      # The dev server serves HTTPS and refuses to start without a cert.
      # Locally that is an mkcert-trusted one; here a throwaway self-signed
      # cert is enough, because the tests run with `ignoreHTTPSErrors` (and
      # mkcert would want sudo).
      - name: Throwaway dev TLS cert
        run: |
          mkdir -p tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout tls/key.pem -out tls/certificate.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Install Playwright Chromium (+ system deps)
        run: bunx playwright install --with-deps chromium

      # `workers: 1` is set in playwright.config.ts, and not out of timidity:
      # every test here drives a WebGL context and Chrome hard-caps live
      # contexts per process, force-losing the oldest past the limit. Parallel
      # scene tests evict each other's contexts and fail in whichever order
      # they happened to run.
      - name: Scene lane
        run: bunx playwright test --project=chromium

      # Its own project and its own step, because it builds and tears down an
      # engine per trip and is ruinously slow downstream of the others.
      # Twenty trips since tosijs-3d 0.8.4 fixed the context churn (#79):
      # ~6 minutes locally, likely more on a CI runner — the test's timeout
      # scales with the trip count.
      - name: Re-parent lane
        run: bunx playwright test --project=reparent

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ensemble editor</title>
    <link rel="icon" href="/favicon.svg" />
    <!--
      The full-screen route is a PAGE THAT USES THE COMPONENT, not an app.

      It carries no logic and no bespoke stylesheet: it loads the same bundle
      every doc page loads (which is what registers <tosi-ensemble-editor>) and
      the same generated theme stylesheet, then gives the component the window.
      If this file ever needs to know something the component doesn't expose,
      that is a missing prop on the component, not a script to add here.
    -->
    <link rel="stylesheet" href="/doc-system.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--background, #101418);
      }
      tosi-ensemble-editor {
        display: block;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <!--
      SAMPLE CONTENT — and note the page does NOT name a library.

      Each ensemble DECLARES the libraries it needs, so this page only supplies
      an address. That is what "consume it anywhere" has to mean: content that
      cannot say what it depends on is an arrangement plus a spoken instruction.

      `test-3.glb` is tosijs-3d's own demo library (24 models — buildings,
      trees, pillars, stairs), served from its doc site. That is a sibling
      project's asset and a fragile thing to depend on; the right home is
      cdn.tosijs.net, whose mirror is the static-assets repo. Kenney's ~4,800
      models are already on that CDN but ship ONE MODEL PER FILE, so they are
      not library-shaped — a combined glb is what this wants.

      Both samples use THIS library's mesh names, so both open clean.
      `outpost.json` is scene features only; `ocean-rig.json` is the
      fortification example and needs the COMBAT PRESET registered — without it
      the editor reports its roles and features as unregistered, which is the
      format telling the truth: a domain it was not given.

      Without any library the editor still works. Pieces render as placeholder
      boxes, because the arrangement is most of what an author is judging.
    -->
    <tosi-ensemble-editor
      backdrop="land"
      src="/ensembles/outpost.json"
    ></tosi-ensemble-editor>
    <script src="/iife.js"></script>
  </body>
</html>
